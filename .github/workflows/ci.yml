name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # E15 fix: workspace cross-package types resolve to dist/ output; a fresh CI
      # install has none (clean-worktree probe reproduced the exact TS2307 failure).
      # Scoped to this job on evidence: vitest/vite transform sources and do not
      # consume dist declarations - their reds wait for run #33's profile, not speculation.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm --filter @accessbase/admin-ui typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # E18 instrumentation (2026-11-06, cut 29): the same command, but it can no longer
      # fail silently. Three runs of "Test is red" told us nothing because the failure
      # detail stayed in a log nobody without sign-in can read - so the job now publishes
      # its own verdict: exit code, whether the junit xml actually landed, the failing-file
      # count, and the first error lines, as an annotation + step summary (both public).
      # `pnpm build` is deliberately NOT added here: vitest transforms sources, and the
      # E15 dist-type mechanism was proven only for tsc (evidence-scoped change).
      - name: Vitest (coverage + junit) with evidence capture
        run: |
          rc=0
          # --reporter=default is restored alongside junit: a junit-ONLY reporter writes the
          # xml and leaves the console nearly mute, which is half of why this job was unread.
          pnpm test:coverage -- --reporter=default --reporter=junit --outputFile=test-results.xml > "$RUNNER_TEMP/vitest.log" 2>&1 || rc=$?
          echo "--- vitest output, last 40 lines ---"
          tail -40 "$RUNNER_TEMP/vitest.log"
          xml=$([ -s test-results.xml ] && echo present || echo MISSING)
          counts=$(grep -E 'Test Files +[0-9]+|Tests +[0-9]+' "$RUNNER_TEMP/vitest.log" | tail -2 | tr -s ' ' | tr '\n' ';')
          firsterrs=$(grep -m3 -E 'Unhandled|Error:|Cannot find|No test files|ENOENT' "$RUNNER_TEMP/vitest.log" | tr '\n' ';' | sed 's/::/--/g')
          echo "::error::vitest exit=$rc | junit-xml=$xml | $counts first-errors: $firsterrs"
          {
            echo "### Test job evidence (vitest exit $rc, junit xml $xml)"
            echo '```'
            grep -E 'FAIL|Test Files|Tests |Unhandled|Cannot find' "$RUNNER_TEMP/vitest.log" | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - uses: dorny/test-reporter@v1
        if: always()
        # E18 attribution hygiene: a missing/unparsable xml must not masquerade as a test
        # failure. The vitest exit code above is the only thing that can redden this job.
        continue-on-error: true
        with:
          name: Test Results
          path: test-results.xml
          reporter: jest-junit

  # Service-free by design: admin-ui has zero runtime @accessbase/* imports, so this
  # job runs no PG/Redis services, no build, no DATABASE_URL. The webServer CI branch
  # starts vite only — the backend must stay DOWN in this job (mock page.route
  # discipline; health.spec self-skips with 5101 unreachable and the chromium project
  # testIgnore excludes setup-real). Real-backend e2e flows are NOT CI-covered here.
  e2e:
    name: E2E (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
  migrate:
    name: Migration chain (ops-migrate)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: accessbase
          POSTGRES_PASSWORD: accessbase
          POSTGRES_DB: accessbase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U accessbase"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://accessbase:accessbase@localhost:5432/postgres
      NO_PROXY: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: npx vitest run apps/server/src/__tests__/ops-migrate.test.ts

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ADJ-7f (governance port Batch 7): tracked generated faces must never be committed
  # stale. Per-machine faces are gitignored — CI skips them (yellow, never exit code);
  # tracked faces are verified by sync-then-diff (a non-empty diff = a stale face was
  # committed = red). Needs node >= 22.6 for native .mts type-stripping; needs
  # pnpm install --frozen-lockfile because gate-mcp inspects installed packages.
  # D122 topology note: origin is Gitee with a one-way GitHub mirror — this job is
  # post-hoc on the mirror, not pre-merge.
  governance:
    name: Governance Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.6'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Regenerate tracked faces and verify no drift
        run: |
          node scripts/agents/agent-links.mts sync
          # E16 instrumentation (2026-11-06): the old one-liner sent git's stderr to
          # /dev/null, so a failure surfaced as a bare exit 1 with no readable cause -
          # three runs of that and nothing local could reproduce it. Capture everything,
          # put the paths in the annotation (public) and the diff in the step summary
          # (also public) so the NEXT run carries its own evidence.
          # `.qoder/rules` dropped from the list: never tracked, never generated; measured
          # exit 0 as a missing pathspec in a clean worktree, so it was noise not a cause.
          drift_rc=0
          git diff --exit-code -- AGENTS.md CONSTRAINTS.md .opencode/opencode.json .mcp.json > "$RUNNER_TEMP/gates-drift.txt" 2>&1 || drift_rc=$?
          if [ "$drift_rc" -ne 0 ]; then
            echo "::error::generated tracked faces are stale (rc=$drift_rc): $(git diff --name-only | tr '\n' ' ') - run \`node scripts/agents/agent-links.mts sync\` locally and commit"
            {
              echo '### Governance Gates drift (rc '"$drift_rc"')'
              echo '```diff'
              head -80 "$RUNNER_TEMP/gates-drift.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Full agents check (CI mode skips gitignored per-machine faces)
        run: CI=1 node scripts/agents/agent-links.mts check
