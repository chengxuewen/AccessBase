# Sample Prometheus alert rules for AccessBase (gap-audit D4). NOT WIRED —
# mount into your Prometheus with rule_files: ["/etc/prometheus/rules.yml"].
# Metric names match apps/server/src/routes/metrics.ts (accessbase_ prefix).
groups:
  - name: accessbase
    rules:
      - alert: AccessBaseAuthFailureSpike
        expr: sum(rate(accessbase_auth_failures_total[5m])) * 60 > 30
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Auth failures above 30/min for 5m (credential stuffing?)"
      - alert: AccessBaseNotReady
        expr: up{job="accessbase"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "AccessBase /metrics scrape failing (process down or draining)"
      - alert: AccessBaseDegraded
        expr: max(accessbase_degraded_mode) > 0
        for: 3m
        labels: { severity: warning }
        annotations:
          summary: "A dependency (redis) has been degraded >3m — throttles/step-up tokens are per-node while this persists"
      - alert: AccessBasePoolWaiting
        expr: max(accessbase_pg_pool{state="waiting"}) > 5
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "pg-pool acquire queue above 5 — consider PG_POOL_MAX / DB capacity"
      - alert: AccessbaseWebhookDeadLettering
        expr: increase(accessbase_webhook_deliveries_total{outcome="dead"}[15m]) > 0
        labels: { severity: warning }
        annotations:
          summary: "A webhook delivery hit the 10-attempt dead letter in the last 15m (subscriber down or endpoint rejecting)"
      - alert: AccessbaseWebhookBacklog
        expr: accessbase_webhook_pending_events > 100 or accessbase_webhook_oldest_pending_age_seconds > 300
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Webhook fan-out backlog above 100 events or oldest pending over 5m for 10m (dispatcher stalled?)"

      # R-audit A4: anchor worker staleness (sample — NOT WIRED, like the rest of this file)
      - alert: AccessbaseAuditAnchorStalled
        expr: time() - accessbase_audit_anchor_last_root_timestamp_seconds > 900
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Audit anchor worker produced no new root in >15m (3x default interval)"
