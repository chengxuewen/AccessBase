services:
  postgres:
    image: postgres:16-alpine
    container_name: accessbase-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: accessbase
      POSTGRES_PASSWORD: accessbase_dev
      POSTGRES_DB: accessbase
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: postgres -c listen_addresses='*'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accessbase -d accessbase"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: accessbase-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass accessbase_dev
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "accessbase_dev", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
