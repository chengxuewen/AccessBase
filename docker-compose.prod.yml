# Production docker-compose — image-based, no build context
name: accessbase
services:
  server:
    image: ghcr.io/accessbase/accessbase:latest
    ports:
      - "5101:5101"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://accessbase:accessbase@localhost:5432/accessbase}
      REDIS_URL: ${REDIS_URL:-redis://localhost:6379}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "2G"
        reservations:
          cpus: "0.5"
          memory: "512M"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5101/health/live"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    volumes:
      - accessbase-data:/var/lib/postgresql/data
      - accessbase-redis:/var/lib/redis

volumes:
  accessbase-data:
  accessbase-redis:
